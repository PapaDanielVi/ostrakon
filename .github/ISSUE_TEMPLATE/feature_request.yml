name: Feature Request

description: Suggest a new feature or enhancement for Ostrakon

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Description
        A clear and concise description of the feature you're requesting.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: |
        What problem does this feature solve? Who would benefit from it?
      placeholder: |
        Describe the problem this feature would solve.
        Who would benefit from this feature?

 - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: |
        Describe the solution you'd like. Include any specific features,
        functionality, or changes you have in mind.
      placeholder: |
        A clear and concise description of what you want to happen.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: |
        Describe any alternative solutions or features you've considered.
      placeholder: |
        A clear and concise description of any alternative solutions
        or features you've considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Add any other context, screenshots, or mockups about the feature
        request here.
      placeholder: |
        Add any other context, screenshots, or mockups about the feature
        request here.

  - type: checkboxes
    id: checkbox
    attributes:
      label: Checklist
      options:
        - label: I searched to see if a similar feature request already exists
          required: true
        - label: I understand this is a suggestion and not a commitment
          required: true